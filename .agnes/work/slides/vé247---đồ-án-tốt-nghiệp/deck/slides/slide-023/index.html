<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 23 - Q&A</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0F172A; }
  .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .slide::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(37,99,235,0.3) 0%, transparent 70%); border-radius: 50%; }
  .slide::after { content: ''; position: absolute; bottom: -150px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%); border-radius: 50%; }
  .content { text-align: center; position: relative; z-index: 1; }
  .big-title { font-size: 72px; font-weight: 900; background: linear-gradient(90deg, #60a5fa, #2563EB, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
  .sub-title { font-size: 24px; color: #94A3B8; margin-bottom: 40px; }
  .divider { width: 200px; height: 3px; background: linear-gradient(90deg, transparent, #2563EB, transparent); margin: 0 auto 40px; }
  .thanks { font-size: 28px; color: white; font-weight: 700; margin-bottom: 10px; }
  .info { font-size: 16px; color: #64748B; }
  .footer { position: absolute; bottom: 20px; right: 40px; font-size: 13px; color: #475569; z-index: 1; }
</style>
</head>
<body>
<div class="slide">
  <div class="content">
    <div class="big-title">Q&A</div>
    <div class="sub-title">Câu hỏi & Thảo luận</div>
    <div class="divider"></div>
    <div class="thanks">Cảm ơn thầy cô đã lắng nghe!</div>
    <div class="info">Vé247 — Hệ thống đặt vé đa phương tiện thông minh</div>
    <div class="info" style="margin-top: 8px;">Sinh viên thực hiện: [Tên SV] · Mã SV: [Mã SV]</div>
  </div>
  <div class="footer">Slide 23 / 23</div>
</div>
</body>
</html>
