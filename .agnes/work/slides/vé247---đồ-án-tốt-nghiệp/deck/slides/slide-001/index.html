<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Slide 1 - Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; }
  .slide { width: 1280px; height: 720px; background: linear-gradient(135deg, #0F172A 0%, #1e293b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; position: relative; overflow: hidden; }
  .slide::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(37,99,235,0.3) 0%, transparent 70%); border-radius: 50%; }
  .slide::after { content: ''; position: absolute; bottom: -150px; left: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%); border-radius: 50%; }
  .slide-title { font-size: 14px; color: #475569; position: absolute; top: 20px; left: 30px; z-index: 2; }
  .logo-area { font-size: 72px; font-weight: 900; letter-spacing: 4px; margin-bottom: 8px; background: linear-gradient(90deg, #60a5fa, #2563EB, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; z-index: 1; }
  .logo-sub { font-size: 20px; color: #94a3b8; letter-spacing: 6px; margin-bottom: 40px; position: relative; z-index: 1; }
  .title-main { font-size: 38px; font-weight: 700; margin-bottom: 12px; text-align: center; position: relative; z-index: 1; }
  .title-sub { font-size: 22px; color: #94a3b8; margin-bottom: 50px; position: relative; z-index: 1; }
  .divider { width: 200px; height: 4px; background: linear-gradient(90deg, transparent, #2563EB, transparent); margin-bottom: 40px; position: relative; z-index: 1; }
  .info-row { display: flex; gap: 60px; position: relative; z-index: 1; }
  .info-item { text-align: center; }
  .info-label { font-size: 13px; color: #64748B; margin-bottom: 4px; }
  .info-value { font-size: 16px; font-weight: 600; color: #e2e8f0; }
  .badge { display: inline-block; background: linear-gradient(90deg, #2563EB, #1D4ED8); padding: 6px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; margin-bottom: 30px; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-title">PHẦN MỞ ĐẦU</div>
  <div class="logo-area">VÉ247</div>
  <div class="logo-sub">BOOKING PLATFORM</div>
  <div class="badge">ĐỒ ÁN MÔN NIÊN LUẬN</div>
  <div class="title-main">Hệ thống đặt vé đa phương tiện thông minh</div>
  <div class="title-sub">Máy bay · Tàu hỏa · Xe khách — Tổng hợp · So sánh · Đặt vé · Thanh toán</div>
  <div class="divider"></div>
  <div class="info-row">
    <div class="info-item"><div class="info-label">Sinh viên thực hiện</div><div class="info-value">[Tên SV]</div></div>
    <div class="info-item"><div class="info-label">Mã sinh viên</div><div class="info-value">[Mã SV]</div></div>
    <div class="info-item"><div class="info-label">Giảng viên hướng dẫn</div><div class="info-value">[GVHD]</div></div>
  </div>
</div>
</body>
</html>
